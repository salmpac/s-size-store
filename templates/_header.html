<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title }}</title>
<link rel="stylesheet" href="{{ base }}/static/style.css">
<link rel="icon" href="{{ base }}/static/favicon.svg" type="image/svg+xml">
</head>
<body data-base="{{ base }}">

<header class="topbar">
  <a class="logo" href="{{ base }}/">
    <span class="logo-mark">s</span><span class="logo-text">-size</span>
  </a>
  <form class="search" action="{{ base }}/" method="get" role="search">
    <input type="search" name="q" placeholder="Поиск по каталогу"
           value="{{ query }}" aria-label="Поиск по каталогу">
  </form>
</header>
